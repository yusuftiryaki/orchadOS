name: orchados_field
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.14
  flutter_riverpod: ^3.4.3
  image: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # 12.x on purpose: permission_handler 13 pulls permission_handler_android 14,
  # which compiles against Android API 37. That platform ships as
  # `android-37.0` and AGP 9.1 (Flutter 3.47 default) looks for `android-37`,
  # so the APK does not build. Move up together with AGP/Flutter.
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
