[project]
name = "orchados-ai-worker"
version = "0.1.0"
description = "orchadOS AI pre-assessment: per-tree scale suggestions from tree crops via the Claude Message Batches API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "httpx>=0.28.1",
    "pillow>=11",
    "pydantic>=2.6",
]

[project.scripts]
ai-worker = "orchados_ai_worker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "supabase: needs the local Supabase stack (pnpm db:start && pnpm db:reset); skipped otherwise",
    "live: calls the real Claude API; runs only with -m live and ANTHROPIC_API_KEY set",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
