# orchadOS kit: the system clock follows the GNSS receiver: its USB time, or its
# PPS when the wire is fitted. Installed as /etc/chrony/conf.d/orchados.conf by
# setup/install.sh.
#
# GNSS: the time that orchados-recorder sends for each NAV-PVT. The message
# reaches the Pi ~55 ms after its epoch (measured 20 Nov 2026; thresholds.py
# CHRONY_USB_OFFSET_MS, gnss-check measures it); `offset` corrects that.
# Without the PPS wire this is the clock's source (a few ms).
refclock SOCK /run/chrony.gnss.sock refid GNSS offset 0.055
# PPS: the precise edge (pps-gpio overlay, GPIO18), its second taken from GNSS.
# Preferred when the wire is fitted; without it no edge comes and GNSS is used.
# `trust`: with two sources, a GNSS interval that misses the PPS edge by a few ms
# would leave chrony without a majority; a trusted source is not rejected by it.
refclock PPS /dev/pps0 lock GNSS refid PPS prefer trust
# The Pi has no network in the field and may boot with a wrong clock:
# step whenever the error is over one second, not only at startup.
makestep 1 -1
