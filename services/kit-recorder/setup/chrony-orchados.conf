# orchadOS kit: the system clock follows the GNSS receiver's PPS.
# Installed as /etc/chrony/conf.d/orchados.conf by setup/install.sh.
#
# GNSS: coarse time samples (tens of ms) that orchados-recorder sends for each
# NAV-PVT; never selected on its own, it only numbers the PPS edges.
refclock SOCK /run/chrony.gnss.sock refid GNSS noselect
# PPS: the precise edge (pps-gpio overlay, GPIO18), its second taken from GNSS.
refclock PPS /dev/pps0 lock GNSS refid PPS prefer
# The Pi has no network in the field and may boot with a wrong clock:
# step whenever the error is over one second, not only at startup.
makestep 1 -1
