[project]
name = "orchados-pipeline"
version = "0.1.0"
description = "orchadOS processing pipeline: ingest, positioning, time sync, frame selection, panoramas and tree crops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gtsam>=4.3.0",
    "httpx>=0.28.1",
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
]

[project.scripts]
orchados-pipeline = "orchados_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "rtklib: needs RTKLIB command line tools (convbin, rnx2rtkp)",
    "supabase: needs the local Supabase stack (pnpm db:start && pnpm db:reset); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
