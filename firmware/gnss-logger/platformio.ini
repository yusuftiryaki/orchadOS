; orchadOS GNSS logger (İP2). See README.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -D GNSS_RAW_RATE_HZ=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
