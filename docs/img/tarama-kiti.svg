<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" width="1680" height="1000" font-family="'DM Sans', Arial, sans-serif">
  <title>orchadOS tarama kiti: motosiklet direğindeki sensörler ve bağlantıları</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8E0"/>
      <stop offset="1" stop-color="#F5F2E8"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9CDAE"/>
      <stop offset="1" stop-color="#BFA97C"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9794"/>
      <stop offset="0.5" stop-color="#E4E8E6"/>
      <stop offset="1" stop-color="#8E9794"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#A8C256"/>
      <stop offset="1" stop-color="#5E8A3A"/>
    </radialGradient>
    <clipPath id="scene">
      <rect x="0" y="0" width="940" height="880"/>
    </clipPath>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E6FB0"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7D3C98"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5D6F64"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1680" height="1000" fill="url(#sky)"/>
  <rect y="880" width="1680" height="120" fill="url(#soil)"/>

  <!-- title -->
  <text x="40" y="68" font-size="40" font-weight="700" fill="#1B3A2F">Tarama kiti</text>
  <text x="40" y="104" font-size="20" fill="#3D5247">RTK GNSS, 360° kamera ve LiDAR motosikletin arkasındaki direkte; kayıt Raspberry Pi 4'te</text>

  <!-- ===== Side view (heights to scale: 1 m = 290 px, ground y = 880) ===== -->

  <!-- LiDAR field of view: the half sphere above its base, 6° below it in negative-angle mode -->
  <g clip-path="url(#scene)">
    <path d="M276 532 L833 590.5 A560 560 0 1 0 -281 590.5 Z" fill="#6FA35A" opacity="0.13"/>
  </g>
  <text x="420" y="176" font-size="15" font-style="italic" fill="#2F6B3A">LiDAR'ın görüş alanı: tabanının üstündeki yarım küre</text>

  <!-- height scale -->
  <g stroke="#5D6F64" stroke-width="2" fill="#3D5247" font-size="15">
    <line x1="70" y1="880" x2="70" y2="290"/>
    <line x1="64" y1="880" x2="76" y2="880"/>
    <line x1="64" y1="735" x2="76" y2="735"/>
    <line x1="64" y1="590" x2="76" y2="590"/>
    <line x1="64" y1="445" x2="76" y2="445"/>
    <line x1="64" y1="300" x2="76" y2="300"/>
    <g stroke="none" text-anchor="end">
      <text x="58" y="885">0</text>
      <text x="58" y="740">0,5</text>
      <text x="58" y="595">1,0</text>
      <text x="58" y="450">1,5</text>
      <text x="58" y="305">2,0 m</text>
    </g>
  </g>
  <g stroke="#7B8A80" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="76" y1="271" x2="200" y2="271"/>
    <line x1="76" y1="300" x2="214" y2="300"/>
    <line x1="76" y1="532" x2="214" y2="532"/>
  </g>

  <!-- pistachio tree -->
  <path d="M780 880 L778 600 Q776 560 760 530 L772 524 Q788 556 792 590 Q800 552 820 528 L830 536 Q808 566 803 600 L802 880 Z" fill="#7A5A3A"/>
  <g fill="url(#canopy)">
    <circle cx="720" cy="450" r="70"/>
    <circle cx="860" cy="450" r="70"/>
    <circle cx="790" cy="400" r="120"/>
    <circle cx="790" cy="320" r="80"/>
  </g>
  <g fill="#C98A8A">
    <circle cx="742" cy="468" r="6"/><circle cx="752" cy="474" r="6"/><circle cx="746" cy="481" r="6"/>
    <circle cx="836" cy="420" r="6"/><circle cx="846" cy="426" r="6"/>
    <circle cx="800" cy="300" r="6"/><circle cx="810" cy="306" r="6"/>
  </g>

  <!-- lowest point the LiDAR sees on the trunk: 1.2 m − 1.74 m × tan 6° ≈ 1.0 m -->
  <line x1="276" y1="532" x2="779" y2="585" stroke="#2F6B3A" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="779" cy="585" r="6" fill="#2F6B3A"/>
  <text x="560" y="553" font-size="15" font-style="italic" fill="#2F6B3A">−6°, negatif açı kipi</text>
  <text x="768" y="612" font-size="15" text-anchor="end" fill="#1B3A2F">gövdede görülen</text>
  <text x="768" y="631" font-size="15" text-anchor="end" fill="#1B3A2F">en alçak nokta ~1,0 m</text>

  <!-- motorcycle (facing right) -->
  <line x1="300" y1="796" x2="165" y2="776" stroke="#8C8C8C" stroke-width="11" stroke-linecap="round"/>
  <line x1="210" y1="822" x2="330" y2="780" stroke="#3A3A3A" stroke-width="10" stroke-linecap="round"/>
  <rect x="300" y="730" width="110" height="70" rx="10" fill="#4A4A4A"/>
  <path d="M330 780 L300 700 L430 690 L470 660 L500 700 L420 760 Z" fill="none" stroke="#B23A2A" stroke-width="10" stroke-linejoin="round"/>
  <path d="M240 700 L300 690 L300 706 L250 712 Z" fill="#B23A2A"/>
  <path d="M260 690 L400 690 L395 706 L265 706 Z" fill="#222"/>
  <path d="M400 690 Q430 655 480 662 L470 700 Z" fill="#B23A2A"/>
  <line x1="520" y1="822" x2="495" y2="650" stroke="#9A9A9A" stroke-width="9" stroke-linecap="round"/>
  <line x1="478" y1="646" x2="514" y2="630" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <circle cx="522" cy="684" r="12" fill="#F3D36B" stroke="#555" stroke-width="2"/>
  <g fill="none" stroke-width="14" stroke="#2B2B2B">
    <circle cx="210" cy="822" r="52"/>
    <circle cx="520" cy="822" r="52"/>
  </g>
  <g fill="none" stroke-width="3" stroke="#9A9A9A">
    <circle cx="210" cy="822" r="30"/>
    <circle cx="520" cy="822" r="30"/>
  </g>
  <!-- rear rack -->
  <rect x="140" y="638" width="170" height="8" fill="#555"/>
  <line x1="170" y1="646" x2="250" y2="700" stroke="#555" stroke-width="5"/>
  <line x1="290" y1="646" x2="290" y2="690" stroke="#555" stroke-width="5"/>

  <!-- electronics box and battery on the rack -->
  <rect x="140" y="588" width="82" height="50" rx="6" fill="#3E5A4C" stroke="#1B3A2F" stroke-width="2"/>
  <text x="181" y="618" font-size="13" font-weight="700" fill="#F5F2E8" text-anchor="middle">Pi 4</text>
  <rect x="244" y="604" width="60" height="34" rx="5" fill="#2E7DBA" stroke="#1D4E75" stroke-width="2"/>
  <text x="274" y="626" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">18 V</text>

  <!-- pole, antenna cable -->
  <rect x="228" y="270" width="8" height="368" fill="url(#alu)"/>
  <line x1="239" y1="276" x2="239" y2="588" stroke="#333" stroke-width="2"/>

  <!-- GNSS antenna (~2.1 m) -->
  <ellipse cx="232" cy="270" rx="30" ry="9" fill="#EFEFEF" stroke="#555" stroke-width="2"/>
  <ellipse cx="232" cy="263" rx="21" ry="8" fill="#FAFAFA" stroke="#555" stroke-width="2"/>

  <!-- 360° camera (~2.0 m) -->
  <rect x="222" y="282" width="20" height="50" rx="7" fill="#1D1D1D"/>
  <circle cx="222" cy="298" r="7" fill="#4B6FA8" stroke="#111" stroke-width="2"/>
  <circle cx="242" cy="298" r="7" fill="#4B6FA8" stroke="#111" stroke-width="2"/>

  <!-- LiDAR (~1.2 m) on a short arm -->
  <rect x="236" y="535" width="24" height="7" fill="#666"/>
  <path d="M260 518 Q276 500 292 518 Z" fill="#3A3A3A"/>
  <rect x="258" y="518" width="36" height="30" rx="4" fill="#2A2A2A"/>
  <rect x="261" y="525" width="30" height="6" fill="#5AA0C8"/>

  <!-- phone on the handlebar -->
  <rect x="505" y="600" width="18" height="30" rx="3" fill="#222"/>
  <rect x="508" y="604" width="12" height="20" fill="#9FD0C0"/>

  <!-- labels on the pole -->
  <g fill="#1B3A2F">
    <line x1="262" y1="266" x2="296" y2="248" stroke="#5D6F64" stroke-width="1.5"/>
    <text x="300" y="244" font-size="19" font-weight="700">GNSS anteni · ~2,1 m</text>
    <text x="300" y="264" font-size="15" fill="#3D5247">Radiolink ANT-M7; gökyüzünü tam görmeli</text>
    <line x1="250" y1="306" x2="296" y2="306" stroke="#5D6F64" stroke-width="1.5"/>
    <text x="300" y="306" font-size="19" font-weight="700">360° kamera · ~2,0 m</text>
    <text x="300" y="326" font-size="15" fill="#3D5247">Insta360 X4 Air; kendi kartına kaydeder</text>
    <text x="310" y="452" font-size="19" font-weight="700">LiDAR · ~1,2 m</text>
    <text x="310" y="472" font-size="15" fill="#3D5247">Unitree L2, dahili IMU</text>
    <text x="310" y="491" font-size="15" fill="#3D5247">(yükseklik denemede seçilecek)</text>
  </g>

  <!-- labels on the ground -->
  <g stroke="#5D6F64" stroke-width="1.5">
    <line x1="150" y1="638" x2="100" y2="905"/>
    <line x1="290" y1="638" x2="330" y2="905"/>
    <line x1="514" y1="630" x2="630" y2="905"/>
  </g>
  <g fill="#1B3A2F" font-size="15">
    <text x="40" y="928" font-size="17" font-weight="700">Elektronik kutusu</text>
    <text x="40" y="950">Raspberry Pi 4, iki ayarlı</text>
    <text x="40" y="970">DC-DC, kayıt SSD'si</text>
    <text x="300" y="928" font-size="17" font-weight="700">18 V alet aküsü</text>
    <text x="300" y="950">sigorta ve anahtarla</text>
    <text x="300" y="970">(henüz alınmadı)</text>
    <text x="600" y="928" font-size="17" font-weight="700">Telefon (gidonda)</text>
    <text x="600" y="950">ön kontrol, uyarılar, QR saat;</text>
    <text x="600" y="970">Pi'a Bluetooth ile bağlı</text>
  </g>

  <!-- ===== Connections ===== -->
  <rect x="960" y="140" width="690" height="800" rx="18" fill="#FFFFFF" fill-opacity="0.93" stroke="#CFD8D2" stroke-width="2"/>
  <text x="990" y="186" font-size="24" font-weight="700" fill="#1B3A2F">Bağlantılar</text>

  <!-- power (red) -->
  <g fill="none" stroke="#C0392B" stroke-width="3.5">
    <path d="M990 248 H975 V788 H990"/>
    <path d="M975 388 H990"/>
    <path d="M975 508 H990"/>
    <path d="M1160 388 H1228" marker-end="url(#arrow-red)"/>
    <path d="M1160 508 H1228" marker-end="url(#arrow-red)"/>
    <path d="M1160 788 H1458" marker-end="url(#arrow-red)"/>
  </g>
  <g fill="#C0392B" font-size="14" font-weight="700">
    <text x="1192" y="378" text-anchor="middle">12 V</text>
    <text x="1192" y="498" text-anchor="middle">5,1 V</text>
    <text x="1310" y="780" text-anchor="middle">USB-C</text>
    <text x="990" y="322" font-weight="400" fill="#7A2A20">sigorta + anahtar</text>
  </g>

  <!-- data (blue) -->
  <g fill="none" stroke="#2E6FB0" stroke-width="3.5">
    <path d="M1315 416 V478" marker-end="url(#arrow-blue)"/>
    <path d="M1500 416 V500 H1402" marker-end="url(#arrow-blue)"/>
    <path d="M1400 575 H1458" marker-end="url(#arrow-blue)"/>
  </g>
  <g fill="#2E6FB0" font-size="14" font-weight="700">
    <text x="1307" y="452" text-anchor="end">Ethernet (UDP)</text>
    <text x="1452" y="492" text-anchor="middle">USB · UBX</text>
    <text x="1430" y="595" text-anchor="middle">USB 3</text>
  </g>

  <!-- antenna cable (grey) -->
  <path d="M1545 276 V358" fill="none" stroke="#6B6B6B" stroke-width="3.5" marker-end="url(#arrow-grey)"/>
  <text x="1553" y="322" font-size="14" fill="#555">koaksiyel</text>

  <!-- PPS (purple) -->
  <path d="M1580 416 V540 H1402" fill="none" stroke="#7D3C98" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <text x="1490" y="532" font-size="14" font-weight="700" fill="#7D3C98" text-anchor="middle">PPS → GPIO18</text>

  <!-- wireless and visual -->
  <path d="M1315 592 V638" fill="none" stroke="#5D6F64" stroke-width="3" stroke-dasharray="7 5" marker-start="url(#arrow-grey)" marker-end="url(#arrow-grey)"/>
  <text x="1325" y="620" font-size="14" fill="#3D5247">Bluetooth</text>
  <path d="M1400 668 H1545 V758" fill="none" stroke="#5D6F64" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow-grey)"/>
  <text x="1537" y="712" font-size="14" fill="#3D5247" text-anchor="end">QR saat işareti</text>

  <!-- boxes -->
  <g font-size="13" fill="#3D5247">
    <rect x="990" y="220" width="170" height="56" rx="10" fill="#E8F1FA" stroke="#2E7DBA" stroke-width="2"/>
    <text x="1004" y="243" font-size="16" font-weight="700" fill="#1B3A2F">Akü 18 V</text>
    <text x="1004" y="263">alet aküsü, ~90 Wh</text>

    <rect x="990" y="360" width="170" height="56" rx="10" fill="#FBEDEA" stroke="#C0392B" stroke-width="2"/>
    <text x="1004" y="383" font-size="16" font-weight="700" fill="#1B3A2F">DC-DC → 12 V</text>
    <text x="1004" y="403">ayarlı; LiDAR için</text>

    <rect x="990" y="480" width="170" height="56" rx="10" fill="#FBEDEA" stroke="#C0392B" stroke-width="2"/>
    <text x="1004" y="503" font-size="16" font-weight="700" fill="#1B3A2F">DC-DC → 5,1 V</text>
    <text x="1004" y="523">ayarlı, ≥ 3 A; Pi için</text>

    <rect x="990" y="760" width="170" height="56" rx="10" fill="#FBEDEA" stroke="#C0392B" stroke-width="2"/>
    <text x="1004" y="783" font-size="16" font-weight="700" fill="#1B3A2F">USB-C PD</text>
    <text x="1004" y="803">kamerayı besler</text>

    <rect x="1230" y="360" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#2A2A2A" stroke-width="2"/>
    <text x="1244" y="383" font-size="16" font-weight="700" fill="#1B3A2F">Unitree L2</text>
    <text x="1244" y="403">LiDAR + IMU, 10 W</text>

    <rect x="1230" y="480" width="170" height="110" rx="10" fill="#E3EFE7" stroke="#1B3A2F" stroke-width="2.5"/>
    <text x="1244" y="505" font-size="16" font-weight="700" fill="#1B3A2F">Raspberry Pi 4</text>
    <text x="1244" y="527">ROS 2 Jazzy</text>
    <text x="1244" y="546">kayıt servisi</text>
    <text x="1244" y="565">saat: PPS + chrony</text>

    <rect x="1230" y="640" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#5D6F64" stroke-width="2"/>
    <text x="1244" y="663" font-size="16" font-weight="700" fill="#1B3A2F">Telefon</text>
    <text x="1244" y="683">saha uygulaması</text>

    <rect x="1460" y="220" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1474" y="243" font-size="16" font-weight="700" fill="#1B3A2F">GNSS anteni</text>
    <text x="1474" y="263">ANT-M7, çift bant</text>

    <rect x="1460" y="360" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#7D3C98" stroke-width="2"/>
    <text x="1474" y="383" font-size="16" font-weight="700" fill="#1B3A2F">RTK alıcısı F9P</text>
    <text x="1474" y="403">ham GNSS, PPS</text>

    <rect x="1460" y="560" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#2E6FB0" stroke-width="2"/>
    <text x="1474" y="583" font-size="16" font-weight="700" fill="#1B3A2F">SSD 512 GB</text>
    <text x="1474" y="603">LiDAR + GNSS kaydı</text>

    <rect x="1460" y="760" width="170" height="56" rx="10" fill="#F1F4F2" stroke="#1D1D1D" stroke-width="2"/>
    <text x="1474" y="783" font-size="16" font-weight="700" fill="#1B3A2F">Insta360 X4 Air</text>
    <text x="1474" y="803">kendi microSD kartı</text>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#3D5247">
    <line x1="990" y1="870" x2="1020" y2="870" stroke="#C0392B" stroke-width="3.5"/>
    <text x="1028" y="875">güç</text>
    <line x1="1080" y1="870" x2="1110" y2="870" stroke="#2E6FB0" stroke-width="3.5"/>
    <text x="1118" y="875">veri</text>
    <line x1="1172" y1="870" x2="1202" y2="870" stroke="#7D3C98" stroke-width="3.5"/>
    <text x="1210" y="875">zaman (PPS)</text>
    <line x1="1312" y1="870" x2="1342" y2="870" stroke="#5D6F64" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="1350" y="875">kablosuz</text>
    <line x1="1430" y1="870" x2="1460" y2="870" stroke="#5D6F64" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="1468" y="875">görsel (QR)</text>
    <text x="990" y="912" font-size="13" fill="#5D6F64">Yan görünüşte yükseklikler ölçekli, parçalar büyütülmüş. Ayrıntı: docs/tarama-kiti.md</text>
  </g>
</svg>
