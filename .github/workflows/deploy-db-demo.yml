name: deploy-db-demo

# Applies migrations and Edge Functions to the demo Supabase project (IP13,
# docs/demo-turu.md §3.4, §15) after they land on main, like deploy-db does
# for the test project. The demo project holds only the synthetic demo org:
# the check step refuses to deploy when it finds a real org, an open demo
# without its secrets, or billing switches. Seed data is never pushed here;
# the demo data comes from the demo-data workflow.
#
# The job runs in the `demo` GitHub Environment, which holds the demo project's
# secrets (deployment branch rule: main only), and only from main. Missing
# secrets fail the job; until the demo project exists the workflow is disabled
# in GitHub (gh workflow disable deploy-db-demo; docs/deployment.md).
#
# Shared demo host (repository variable DEMO_HOST=test, docs/demo-turu.md
# §15.1): the test project hosts the demo, and deploy-db already pushes its
# migrations and Edge Functions. The job then runs in the `test` environment
# with the test project's secrets and only checks the shared demo locks
# (scripts/demo-lock-check.sh shared); nothing is pushed twice.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db-demo.yml"
      - "scripts/demo-guard-check.sh"
      - "scripts/demo-lock-check.sh"
  workflow_dispatch:

concurrency:
  group: deploy-db-demo
  cancel-in-progress: false

jobs:
  push-migrations:
    # A dispatch from another branch would run that branch's workflow and
    # migrations with the demo project's postgres password.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ vars.DEMO_HOST == 'test' && 'test' || 'demo' }}
    env:
      SHARED: ${{ vars.DEMO_HOST == 'test' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Shared: the test project's ref; its database password is not needed.
      SUPABASE_DB_PASSWORD: ${{ vars.DEMO_HOST != 'test' && secrets.DEMO_SUPABASE_DB_PASSWORD || '' }}
      SUPABASE_PROJECT_REF: ${{ secrets[vars.DEMO_HOST == 'test' && 'SUPABASE_PROJECT_REF' || 'DEMO_SUPABASE_PROJECT_REF'] }}
    steps:
      - name: Check the demo project's secrets
        run: |
          if [ "$SHARED" = "true" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
              echo "::error::DEMO_HOST=test but SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is missing in the test environment (docs/demo-turu.md §15.1)."
              exit 1
            fi
            echo "::notice::DEMO_HOST=test: the test project hosts the demo; deploy-db pushes its migrations and functions, this job only checks the shared demo locks."
          elif [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, DEMO_SUPABASE_DB_PASSWORD or DEMO_SUPABASE_PROJECT_REF is missing in the demo environment (docs/demo-turu.md §15)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check shared demo locks
        if: env.SHARED == 'true'
        run: scripts/demo-lock-check.sh shared

      - uses: pnpm/action-setup@v4
        if: env.SHARED != 'true'

      - uses: actions/setup-node@v4
        if: env.SHARED != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.SHARED != 'true'

      - name: Link project
        id: link
        if: env.SHARED != 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Demo project locks (scripts/demo-lock-check.sh separate), read through
      # the Management API with the access token: secret names (values are not
      # returned in clear) and one read-only query. Fails when an org is not a
      # demo org (real data never lives here), when a demo org is enabled while
      # a secret or Vault entry demo-start needs is missing, when any org
      # accepts sign-ups or fake payments, when PAYMENT_FAKE_ALLOWED is set, or
      # when a demo account has access outside the demo org.
      - name: Check demo project locks
        id: locks
        if: env.SHARED != 'true'
        run: scripts/demo-lock-check.sh separate

      - name: Push migrations
        if: env.SHARED != 'true'
        # --include-all: parallel branches add migrations whose timestamps can be
        # older than one already applied; they are independent by convention.
        run: pnpm exec supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      # A late-merged migration with an older timestamp lands after the IP13-A
      # ones here (but before them on a fresh CI database): re-attach the demo
      # write guard and fail on any demo guard lost to migration order. Runs
      # even when the push failed: each migration file commits on its own, so
      # tables from the files applied before the failure need the guard too.
      - name: Check demo guards
        if: ${{ !cancelled() && env.SHARED != 'true' && steps.link.outcome == 'success' && steps.locks.outcome == 'success' }}
        run: scripts/demo-guard-check.sh

      # Without a name every function under supabase/functions is deployed
      # (demo-start included). The functions read SUPABASE_URL /
      # SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY from the hosted project
      # itself; the service role key never leaves Supabase. verify_jwt per
      # function comes from supabase/config.toml.
      - name: Deploy Edge Functions
        if: env.SHARED != 'true'
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
