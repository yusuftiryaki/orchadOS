name: ci-ingest

on:
  pull_request:
    paths:
      - "services/ingest/**"
      - ".github/workflows/ci-ingest.yml"
  push:
    branches: [main]
    paths:
      - "services/ingest/**"
      - ".github/workflows/ci-ingest.yml"

concurrency:
  group: ci-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4

      # The tests start MinIO (cgr.dev) and Azurite (mcr.microsoft.com) themselves;
      # pulling first keeps image downloads out of the test timings.
      - name: Pull MinIO and Azurite images
        run: |
          docker pull cgr.dev/chainguard/minio:latest
          docker pull mcr.microsoft.com/azure-storage/azurite:3.35.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (MinIO and Azurite tests must not be skipped here)
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -qE "SKIPPED.*(MinIO|Azurite) not available" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::MinIO/Azurite integration tests were skipped"
            exit 1
          fi
