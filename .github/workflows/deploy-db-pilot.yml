name: deploy-db-pilot

# Applies migrations and Edge Functions to the pilot (production) Supabase project
# when they land on the `release` branch. main -> release is a deliberate step
# (a PR), so the pilot only gets what was tried on the test project first.
# Seed data is never pushed here (see docs/deployment.md).

on:
  push:
    branches: [release]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db-pilot.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db-pilot
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.PILOT_SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when pilot Supabase secrets are not configured yet
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Pilot Supabase secrets are not set; skipping pilot deploy (see docs/deployment.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: release

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.ready == 'true'

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Payment locks (docs/musteri-yonetimi.md §15, docs/deployment.md "Ödeme (İP12)"):
      # the pilot never runs the fake payment provider, and self-service signup
      # is never open without Turnstile and its own secrets (customer-signup
      # needs SIGNUP_HASH_SECRET, and SIGNUP_PROXY_SECRET for the client IP;
      # SIGNUP_TURNSTILE_DISABLED is local only). Read through the Management API with
      # the access token: secret names (values are not returned in clear) and
      # one read-only query. org_billing_setting may not exist yet (to_regclass).
      - name: Check payment and signup locks
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          secrets=$(curl -fsS -H "$auth" "$api/secrets" | jq -r '.[].name')
          sql="select
            case when to_regclass('public.org_billing_setting') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from public.org_billing_setting where allow_fake_payments', false, true, '')))[1]::text::int
            end as fake_orgs,
            case when to_regclass('public.org_billing_setting') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from public.org_billing_setting where accepts_signups', false, true, '')))[1]::text::int
            end as signup_orgs"
          counts=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$sql" '{query: $q}')" "$api/database/query")
          fake_orgs=$(echo "$counts" | jq -r '.[0].fake_orgs')
          signup_orgs=$(echo "$counts" | jq -r '.[0].signup_orgs')
          failed=0
          if echo "$secrets" | grep -qx 'PAYMENT_FAKE_ALLOWED'; then
            echo "::error::PAYMENT_FAKE_ALLOWED is set on the pilot project; remove it (supabase secrets unset PAYMENT_FAKE_ALLOWED)."
            failed=1
          fi
          if [ "$fake_orgs" != "0" ]; then
            echo "::error::$fake_orgs org(s) have org_billing_setting.allow_fake_payments = true on the pilot project."
            failed=1
          fi
          if echo "$secrets" | grep -qx 'SIGNUP_TURNSTILE_DISABLED'; then
            echo "::error::SIGNUP_TURNSTILE_DISABLED is set on the pilot project; remove it (supabase secrets unset SIGNUP_TURNSTILE_DISABLED)."
            failed=1
          fi
          if [ "$signup_orgs" != "0" ]; then
            for name in TURNSTILE_SECRET_KEY SIGNUP_HASH_SECRET SIGNUP_PROXY_SECRET; do
              if ! echo "$secrets" | grep -qx "$name"; then
                echo "::error::accepts_signups is on but the $name secret is missing on the pilot project."
                failed=1
              fi
            done
          fi
          exit "$failed"

      - name: Push migrations
        if: steps.guard.outputs.ready == 'true'
        # --include-all: parallel branches add migrations whose timestamps can be
        # older than one already applied; they are independent by convention.
        run: pnpm exec supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      # Without a name every function under supabase/functions is deployed
      # (payments, payment-callback, payment-webhook included).
      # The functions read SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
      # from the hosted project itself; the service role key never leaves Supabase.
      # verify_jwt per function comes from supabase/config.toml.
      - name: Deploy Edge Functions
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
