name: deploy-db-pilot

# Applies migrations and Edge Functions to the pilot (production) Supabase project
# when they land on the `release` branch. main -> release is a deliberate step
# (a PR), so the pilot only gets what was tried on the test project first.
# Seed data is never pushed here (see docs/deployment.md).
#
# The job runs in the `pilot` GitHub Environment, which holds the pilot
# project's secrets (deployment branch rule: release only), and only from
# release. Missing secrets fail the job; until the pilot project exists the
# workflow is disabled in GitHub (gh workflow disable deploy-db-pilot).

on:
  push:
    branches: [release]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db-pilot.yml"
      - "scripts/demo-guard-check.sh"
      - "scripts/retention-check.sh"
      - "scripts/vault-signup-cleanup.sh"
  workflow_dispatch:

concurrency:
  group: deploy-db-pilot
  cancel-in-progress: false

jobs:
  push-migrations:
    # A dispatch from another branch would run that branch's workflow and
    # migrations with the pilot project's postgres password.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pilot
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PILOT_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.PILOT_SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the pilot project's secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, PILOT_SUPABASE_DB_PASSWORD or PILOT_SUPABASE_PROJECT_REF is missing in the pilot environment (docs/deployment.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Link project
        id: link
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Payment locks (docs/musteri-yonetimi.md §15, docs/deployment.md "Ödeme (İP12)"):
      # the pilot never runs the fake payment provider, and self-service signup
      # is never open without its robot check and its own secrets (customer-signup
      # needs SIGNUP_HASH_SECRET, and SIGNUP_PROXY_SECRET for the client IP;
      # SIGNUP_TURNSTILE_DISABLED is local only). The robot check is Turnstile
      # (TURNSTILE_SECRET_KEY) unless CAPTCHA_PROVIDER=altcha (ALTCHA_HMAC_KEY;
      # docs/deployment.md › Robot doğrulaması); any other provider fails. Read
      # through the Management API with the access token: secret names with the
      # sha256 digest of each value (values are not returned in clear) and one
      # read-only query. org_billing_setting may not exist yet (to_regclass).
      # Demo tour (docs/demo-turu.md §3.4, §15): the pilot never hosts the
      # demo, so it has no demo org, no ORCHADOS_DEMO_MODE and no demo-media
      # object (private.demo_org may not exist yet either).
      - name: Check payment and signup locks
        id: locks
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          secrets_json=$(curl -fsS -H "$auth" "$api/secrets")
          secrets=$(jq -r '.[].name' <<<"$secrets_json")
          provider=$(jq -r '.[] | select(.name == "CAPTCHA_PROVIDER") | .value // ""' <<<"$secrets_json")
          sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          sql="select
            case when to_regclass('public.org_billing_setting') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from public.org_billing_setting where allow_fake_payments', false, true, '')))[1]::text::int
            end as fake_orgs,
            case when to_regclass('public.org_billing_setting') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from public.org_billing_setting where accepts_signups', false, true, '')))[1]::text::int
            end as signup_orgs,
            case when to_regclass('private.demo_org') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from private.demo_org', false, true, '')))[1]::text::int
            end as demo_orgs,
            case when to_regclass('storage.objects') is null then 0
              else (xpath('/row/n/text()', query_to_xml(
                'select count(*) as n from storage.objects where bucket_id = ''demo-media''', false, true, '')))[1]::text::int
            end as demo_media_objects"
          counts=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$sql" '{query: $q}')" "$api/database/query")
          fake_orgs=$(echo "$counts" | jq -r '.[0].fake_orgs')
          signup_orgs=$(echo "$counts" | jq -r '.[0].signup_orgs')
          demo_orgs=$(echo "$counts" | jq -r '.[0].demo_orgs')
          demo_media_objects=$(echo "$counts" | jq -r '.[0].demo_media_objects')
          failed=0
          if echo "$secrets" | grep -qx 'PAYMENT_FAKE_ALLOWED'; then
            echo "::error::PAYMENT_FAKE_ALLOWED is set on the pilot project; remove it (supabase secrets unset PAYMENT_FAKE_ALLOWED)."
            failed=1
          fi
          if [ "$fake_orgs" != "0" ]; then
            echo "::error::$fake_orgs org(s) have org_billing_setting.allow_fake_payments = true on the pilot project."
            failed=1
          fi
          if echo "$secrets" | grep -qx 'SIGNUP_TURNSTILE_DISABLED'; then
            echo "::error::SIGNUP_TURNSTILE_DISABLED is set on the pilot project; remove it (supabase secrets unset SIGNUP_TURNSTILE_DISABLED)."
            failed=1
          fi
          captcha_key=TURNSTILE_SECRET_KEY
          if [ "$provider" = "$(sha altcha)" ]; then
            captcha_key=ALTCHA_HMAC_KEY
          elif [ -n "$provider" ] && [ "$provider" != "$(sha turnstile)" ]; then
            echo "::error::CAPTCHA_PROVIDER on the pilot project is neither turnstile nor altcha; sign-ups and the demo stay closed with it."
            failed=1
          fi
          if [ "$signup_orgs" != "0" ]; then
            for name in "$captcha_key" SIGNUP_HASH_SECRET SIGNUP_PROXY_SECRET; do
              if ! echo "$secrets" | grep -qx "$name"; then
                echo "::error::accepts_signups is on but the $name secret is missing on the pilot project."
                failed=1
              fi
            done
          fi
          if [ "$demo_orgs" != "0" ]; then
            echo "::error::private.demo_org has $demo_orgs row(s) on the pilot project; the demo tour runs on its own project only."
            failed=1
          fi
          if echo "$secrets" | grep -qx 'ORCHADOS_DEMO_MODE'; then
            echo "::error::ORCHADOS_DEMO_MODE is set on the pilot project; remove it (supabase secrets unset ORCHADOS_DEMO_MODE)."
            failed=1
          fi
          if [ "$demo_media_objects" != "0" ]; then
            echo "::error::The demo-media bucket holds $demo_media_objects object(s) on the pilot project."
            failed=1
          fi
          exit "$failed"

      - name: Push migrations
        # --include-all: parallel branches add migrations whose timestamps can be
        # older than one already applied; they are independent by convention.
        run: pnpm exec supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      # A late-merged migration with an older timestamp lands after the IP13-A
      # ones here (but before them on a fresh CI database): re-attach the demo
      # write guard and fail on any demo guard lost to migration order. Runs
      # even when the push failed: each migration file commits on its own, so
      # tables from the files applied before the failure need the guard too.
      - name: Check demo guards
        if: ${{ !cancelled() && steps.link.outcome == 'success' && steps.locks.outcome == 'success' }}
        run: scripts/demo-guard-check.sh

      # Without a name every function under supabase/functions is deployed
      # (payments, payment-callback, payment-webhook included).
      # The functions read SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
      # from the hosted project itself; the service role key never leaves Supabase.
      # verify_jwt per function comes from supabase/config.toml.
      - name: Deploy Edge Functions
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      # The hourly signup-cleanup job calls Vault signup_cleanup_url: this
      # project's customer-signup function. Not a secret; created or corrected
      # on every run (the cron secret is checked below, never written here).
      - name: Set Vault signup_cleanup_url
        if: ${{ !cancelled() && steps.link.outcome == 'success' && steps.locks.outcome == 'success' }}
        run: scripts/vault-signup-cleanup.sh

      # T09 (docs/hukuk/kararlar.md H25): while an org accepts sign-ups, the
      # pg_cron job signup-cleanup, Vault signup_cleanup_url and an
      # orchados_cron_secret equal to the ORCHADOS_CRON_SECRET Edge secret
      # must be in place, or accounts whose phone is never verified stay.
      # After the push: the job comes with the migrations.
      - name: Check the unverified-account clean-up
        if: ${{ !cancelled() && steps.link.outcome == 'success' && steps.locks.outcome == 'success' }}
        run: scripts/retention-check.sh signup
