name: ci-field

on:
  pull_request:
    paths:
      - "apps/field/**"
      - ".github/workflows/ci-field.yml"
  push:
    branches: [main]
    paths:
      - "apps/field/**"
      - ".github/workflows/ci-field.yml"

concurrency:
  group: ci-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/field
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code

      # Built on PRs too: Android SDK/plugin mismatches only show up here.
      - name: Build debug APK
        run: flutter build apk --debug

      # Kept only from main to save artifact storage.
      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: orchados-saha-debug-apk
          path: apps/field/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # A second APK from main, wired to the Supabase test project, for trying
      # the app on a phone with real sign-in, tasks and sync. URL and the
      # publishable (anon) key come from repository secrets: the key is not
      # secret, but it stays out of this file.
      - name: Build test APK (Supabase test project)
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required for the test APK"
            exit 1
          fi
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/orchados-saha-test.apk

      - name: Upload test APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: orchados-saha-test-apk
          path: apps/field/build/app/outputs/flutter-apk/orchados-saha-test.apk
          retention-days: 7
