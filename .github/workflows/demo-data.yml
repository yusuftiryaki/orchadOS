name: demo-data

# Loads, enables or disables the demo tour dataset (docs/demo-turu.md §10.4) on the
# hosted test or demo project. Manual only; there is no pilot option.
#
# - load: build the synthetic media (or reuse an earlier run's build artifact),
#   load it with `orchados-pipeline demo load --target remote --verify`. The demo
#   project always gets --demo-only: a project with any other org is refused.
# - enable / disable: only the registry switch; nothing is built.
#
# SQL goes through psql with the project's database password over the session
# pooler (GitHub runners have no IPv6, so never db.<ref>.supabase.co); media go
# through the Storage API with the anon key as the demo org's ops persona. The
# service role key is not used.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Hosted project"
        type: choice
        options: [test, demo]
        default: test
      action:
        description: "load, enable or disable"
        type: choice
        options: [load, enable, disable]
        default: load
      dry_run:
        description: "load: run the SQL and roll it back (nothing written)"
        type: boolean
        default: false
      reuse_build_run_id:
        description: "load: id of an earlier demo-data run whose build artifact to reuse"
        type: string
        required: false

concurrency:
  group: demo-data-${{ inputs.project }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # download-artifact from another run

jobs:
  demo-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROJECT: ${{ inputs.project }}
      ACTION: ${{ inputs.action }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TEST_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TEST_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TEST_URL: ${{ secrets.SUPABASE_URL }}
      TEST_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DEMO_REF: ${{ secrets.DEMO_SUPABASE_PROJECT_REF }}
      DEMO_DB_PASSWORD: ${{ secrets.DEMO_SUPABASE_DB_PASSWORD }}
      DEMO_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      DEMO_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
      BUILD_DIR: services/pipeline/.demo-build/v1-full
    steps:
      # The project's own secrets only: a missing demo secret never falls back to test.
      - name: Select the project's secrets
        id: guard
        run: |
          if [ "$PROJECT" = "demo" ]; then
            ref="$DEMO_REF"; pw="$DEMO_DB_PASSWORD"; url="$DEMO_URL"; anon="$DEMO_ANON_KEY"
          else
            ref="$TEST_REF"; pw="$TEST_DB_PASSWORD"; url="$TEST_URL"; anon="$TEST_ANON_KEY"
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ref" ] || [ -z "$pw" ] || [ -z "$url" ] || [ -z "$anon" ]; then
            echo "::warning::Secrets for the $PROJECT project are not set; skipping (docs/demo-turu.md §13)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "PROJECT_REF=$ref"
            echo "PGPASSWORD=$pw"
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.ready == 'true'

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$PGPASSWORD"

      - name: Session pooler address
        if: steps.guard.outputs.ready == 'true'
        run: |
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::supabase/.temp/pooler-url is missing after supabase link; cannot reach the database over IPv4."
            exit 1
          fi
          url=$(tr -d '\n' < supabase/.temp/pooler-url)
          # Transaction mode (6543) -> session mode (5432): the load is one long transaction.
          url=$(printf '%s' "$url" | sed -E 's#:6543/#:5432/#')
          case "$url" in
            *:5432/*) ;;
            *) echo "::error::unexpected pooler address (no port 5432)"; exit 1 ;;
          esac
          echo "DEMO_DB_URL=$url" >> "$GITHUB_ENV"
          psql --version

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.ready == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock

      - name: Install the pipeline
        if: steps.guard.outputs.ready == 'true'
        working-directory: services/pipeline
        run: uv sync --locked

      - name: Download an earlier build
        if: steps.guard.outputs.ready == 'true' && inputs.action == 'load' && inputs.reuse_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: demo-build-full
          path: ${{ env.BUILD_DIR }}
          run-id: ${{ inputs.reuse_build_run_id }}
          github-token: ${{ github.token }}

      - name: Build the synthetic media (full profile)
        if: steps.guard.outputs.ready == 'true' && inputs.action == 'load' && inputs.reuse_build_run_id == ''
        working-directory: services/pipeline
        run: uv run orchados-pipeline demo build --profile full

      - name: Size limit (150 MB)
        if: steps.guard.outputs.ready == 'true' && inputs.action == 'load'
        run: |
          bytes=$(du -sb "$BUILD_DIR/files" | cut -f1)
          echo "build: $((bytes / 1000000)) MB in $(ls "$BUILD_DIR/files" | wc -l) files"
          if [ "$bytes" -gt 150000000 ]; then
            echo "::error::the demo build is over 150 MB"
            exit 1
          fi

      # Kept so a partial load can be resumed with the same bytes (reuse_build_run_id).
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.ready == 'true' && inputs.action == 'load'
        with:
          name: demo-build-full
          path: ${{ env.BUILD_DIR }}
          retention-days: 30
          include-hidden-files: true

      - name: Load
        if: steps.guard.outputs.ready == 'true' && inputs.action == 'load'
        working-directory: services/pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(demo load --target remote --profile full --build "$GITHUB_WORKSPACE/$BUILD_DIR" --verify)
          if [ "$PROJECT" = "demo" ]; then args+=(--demo-only); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          set -o pipefail
          uv run orchados-pipeline "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/demo-load.log"

      - name: ${{ inputs.action }}
        if: steps.guard.outputs.ready == 'true' && inputs.action != 'load'
        working-directory: services/pipeline
        run: |
          set -o pipefail
          uv run orchados-pipeline demo "$ACTION" --target remote 2>&1 | tee "$RUNNER_TEMP/demo-load.log"

      - name: Summary
        if: always() && steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "### demo-data: $ACTION on $PROJECT"
            if [ -f "$RUNNER_TEMP/demo-load.log" ]; then
              echo '```'
              grep -E '^(rows inserted|  [a-z]+\.|files:|verify|already loaded|demo (enabled|disabled)|dry run|warning|error)' "$RUNNER_TEMP/demo-load.log" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
