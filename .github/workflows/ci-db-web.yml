name: ci-db-web

on:
  pull_request:
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"

concurrency:
  group: ci-db-web-${{ github.ref }}
  cancel-in-progress: true

# Anonymous pulls from public.ecr.aws hit its per-IP data limit on shared
# runners; Docker Hub does not rate-limit GitHub-hosted runners.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  db-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Apply migrations and seed
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      - name: Generated database types are up to date
        run: |
          pnpm web:typegen
          git diff --exit-code -- apps/web/src/lib/database.types.ts

      - name: Lint, format, typecheck
        run: pnpm web:lint

      - name: Build
        run: pnpm web:build

      - name: Unit and integration tests
        run: pnpm web:test

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser tests
        run: |
          pnpm db:reset
          pnpm web:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
