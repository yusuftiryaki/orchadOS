name: ci-db-web

on:
  pull_request:
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "services/pipeline/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"
      - "scripts/check-migration-order.sh"
      - "scripts/demo-lock-check.sh"
      - "scripts/test-demo-lock-sql.sh"
      - "scripts/kvkk/**"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "services/pipeline/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"
      - "scripts/check-migration-order.sh"
      - "scripts/demo-lock-check.sh"
      - "scripts/test-demo-lock-sql.sh"
      - "scripts/kvkk/**"

concurrency:
  group: ci-db-web-${{ github.ref }}
  cancel-in-progress: true

# Anonymous pulls from public.ecr.aws hit its per-IP data limit on shared
# runners; Docker Hub does not rate-limit GitHub-hosted runners.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  db-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # supabase/testing/ (test cleanup) is loaded as a seed, locally and here only;
      # a migration would send it to the test and production projects (deploy-db).
      - name: Test cleanup functions stay out of migrations
        run: |
          if grep -rniE "schema( if not exists)? +testing|testing\.(purge|reset|seed)" supabase/migrations; then
            echo "::error::supabase/testing/ is local only; a migration must not create it"
            exit 1
          fi

      # KVKK request scripts (docs/hukuk/kararlar.md H26, T11); the
      # integration test kvkk-scripts runs them against the local stack.
      - name: Shellcheck KVKK scripts
        run: shellcheck scripts/kvkk/*.sh

      # New migrations sort after the newest one on the base branch (CLAUDE.md):
      # `supabase migration new` can stamp a date before already merged,
      # future-dated migrations, whose functions it would then run without.
      - name: New migrations sort after the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          scripts/check-migration-order.sh FETCH_HEAD

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Apply migrations and seed
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      # The demo lock query (scripts/demo-lock-check.sh) on crafted rows; the
      # ci-scripts mock only returns canned counts.
      - name: Demo lock query against the database
        run: scripts/test-demo-lock-sql.sh

      - name: Generated database types are up to date
        run: |
          pnpm web:typegen
          git diff --exit-code -- apps/web/src/lib/database.types.ts

      - name: Lint, format, typecheck
        run: pnpm web:lint

      - name: Build
        run: pnpm web:build

      # The demo tour dataset (IP13, docs/demo-turu.md §10) and the office
      # tool's synthetic panoramas are built by services/pipeline: with uv here,
      # demo-dataset.test.ts, demo-tour.spec.ts and office-tool.spec.ts run.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock

      - name: Install pipeline dependencies
        working-directory: services/pipeline
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends rtklib
          uv sync --locked

      - name: Cache the demo tour build
        uses: actions/cache@v4
        with:
          path: services/pipeline/.demo-build
          key: demo-build-${{ hashFiles('services/pipeline/src/**', 'services/pipeline/uv.lock') }}

      - name: Cache the office tool's synthetic panoramas
        uses: actions/cache@v4
        with:
          path: apps/web/.dev-data/e2e
          key: office-e2e-${{ hashFiles('services/pipeline/src/**', 'services/pipeline/uv.lock', 'apps/web/scripts/office-dev-data.mjs') }}

      - name: Load the demo tour dataset
        run: pnpm db:demo-tour --profile test --reset-local

      - name: Unit and integration tests
        run: pnpm web:test

      # Order independence: rows the web tests leave behind must not break pgTAP.
      - name: Database tests after the web tests
        run: pnpm db:test

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser tests
        run: |
          pnpm db:reset
          pnpm web:e2e
          pnpm db:test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
