name: ci-db-web

on:
  pull_request:
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "test-vectors/**"
      - "services/pipeline/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"
      - ".github/actions/**"
      - "scripts/check-migration-order.sh"
      - "scripts/demo-lock-check.sh"
      - "scripts/test-demo-lock-sql.sh"
      - "scripts/retention-check.sh"
      - "scripts/provision-pilot-signup.sh"
      - "scripts/vault-signup-cleanup.sh"
      - "scripts/kvkk/**"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/web/**"
      - "test-vectors/**"
      - "services/pipeline/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-db-web.yml"
      - ".github/actions/**"
      - "scripts/check-migration-order.sh"
      - "scripts/demo-lock-check.sh"
      - "scripts/test-demo-lock-sql.sh"
      - "scripts/retention-check.sh"
      - "scripts/provision-pilot-signup.sh"
      - "scripts/vault-signup-cleanup.sh"
      - "scripts/kvkk/**"

concurrency:
  group: ci-db-web-${{ github.ref }}
  cancel-in-progress: true

# Anonymous pulls from public.ecr.aws hit its per-IP data limit on shared
# runners; Docker Hub does not rate-limit GitHub-hosted runners.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

# The checks run side by side (docs/deployment.md, "CI"): static checks without
# a database, the database and integration tests, and the browser tests in
# groups balanced by their run times, each group on its own runner with its
# own local Supabase. The last job, db-web, gathers them under the check name
# the pull requests have always shown.
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # supabase/testing/ (test cleanup) is loaded as a seed, locally and here only;
      # a migration would send it to the test and production projects (deploy-db).
      - name: Test cleanup functions stay out of migrations
        run: |
          if grep -rniE "schema( if not exists)? +testing|testing\.(purge|reset|seed)" supabase/migrations; then
            echo "::error::supabase/testing/ is local only; a migration must not create it"
            exit 1
          fi

      # KVKK request scripts (docs/hukuk/kararlar.md H26, T11); the
      # integration test kvkk-scripts runs them against the local stack.
      - name: Shellcheck KVKK scripts
        run: shellcheck scripts/kvkk/*.sh

      # New migrations sort after the newest one on the base branch (CLAUDE.md):
      # `supabase migration new` can stamp a date before already merged,
      # future-dated migrations, whose functions it would then run without.
      - name: New migrations sort after the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          scripts/check-migration-order.sh FETCH_HEAD

      - uses: ./.github/actions/setup-web

      - name: Lint, format, typecheck
        run: pnpm web:lint

      - name: Unit tests
        run: pnpm --filter web test:unit

      - name: Build
        run: pnpm web:build

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-web

      - name: Start local Supabase
        run: pnpm db:start

      - name: Apply migrations and seed
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      # The demo lock query (scripts/demo-lock-check.sh), the retention query
      # and the pilot sign-up SQL (scripts/provision-pilot-signup.sh) on
      # crafted rows; the ci-scripts mocks only return canned counts.
      - name: Demo lock query against the database
        run: scripts/test-demo-lock-sql.sh

      - name: Generated database types are up to date
        run: |
          pnpm web:typegen
          git diff --exit-code -- apps/web/src/lib/database.types.ts

      # The demo tour dataset (IP13, docs/demo-turu.md §10) is built by
      # services/pipeline: with it, demo-dataset.test.ts runs.
      - uses: ./.github/actions/setup-pipeline

      - name: Load the demo tour dataset
        run: pnpm db:demo-tour --profile test --reset-local

      - name: Integration tests
        run: pnpm --filter web test:integration

      # Order independence: rows the web tests leave behind must not break pgTAP.
      - name: Database tests after the web tests
        run: pnpm db:test

  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Groups balanced by run time (about 3.5 minutes of tests each on
      # 11 November 2026). E2E_ONLY runs the listed spec files, E2E_SKIP
      # leaves them out (apps/web/playwright.config.ts); the last group skips
      # the others' files, so a new spec file runs there without being listed.
      matrix:
        include:
          - group: tour
            only: demo-tour.spec.ts,staff-screens.spec.ts,customer-journey.spec.ts
            skip: ""
          - group: maps-office
            only: maps.spec.ts,office-tool.spec.ts,portal-owner.spec.ts,operations-ui.spec.ts,portal-parcel-a11y.spec.ts
            skip: ""
          - group: rest
            only: ""
            skip: demo-tour.spec.ts,staff-screens.spec.ts,customer-journey.spec.ts,maps.spec.ts,office-tool.spec.ts,portal-owner.spec.ts,operations-ui.spec.ts,portal-parcel-a11y.spec.ts
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-web

      # A fresh stack: start applies the migrations and the seed.
      - name: Start local Supabase
        run: pnpm db:start

      # The demo tour dataset and the office tool's synthetic panoramas (the
      # global setup of the browser tests builds and loads them).
      - uses: ./.github/actions/setup-pipeline

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Browser tests
        env:
          E2E_ONLY: ${{ matrix.only }}
          E2E_SKIP: ${{ matrix.skip }}
        run: |
          pnpm web:e2e
          pnpm db:test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: apps/web/playwright-report
          retention-days: 7

  # The check name pull requests and branch rules know: green only when every
  # job above is.
  db-web:
    if: always()
    needs: [static, db, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a db-web job did not pass ($RESULTS)"
              exit 1
            fi
          done
