name: build-processing-image

# Builds the processing image, runs it end to end on a synthetic session (MinIO as
# the raw store, local Supabase, CPU only) and, on main and on processing-v* tags,
# publishes it to ghcr.io/yusuftiryaki/orchados-processing.

on:
  pull_request:
    paths:
      - "deploy/processing/**"
      - "services/pipeline/**"
      - "services/ai-worker/**"
      - "services/ingest/**"
      - "supabase/**"
      - ".github/workflows/build-processing-image.yml"
  push:
    branches: [main]
    tags: ["processing-v*"]
    paths:
      - "deploy/processing/**"
      - "services/pipeline/**"
      - "services/ai-worker/**"
      - "services/ingest/**"
      - "supabase/**"
      - ".github/workflows/build-processing-image.yml"
  workflow_dispatch:

concurrency:
  group: build-processing-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orchados-processing
  # Same as ci-pipeline: anonymous pulls from public.ecr.aws hit its per-IP limit
  # on shared runners. This affects only the Supabase CLI's own images.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/processing/Dockerfile
          load: true
          tags: orchados-processing:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint shell scripts
        run: |
          cd deploy/processing
          shellcheck -x orchados-process machine.sh providers/*.sh linux/startup.sh tests/*.sh

      - name: Machine scripts against fake provider CLIs
        run: deploy/processing/tests/machine-dry-run.sh

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Supabase CLI
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Apply migrations and seed
        run: pnpm db:reset

      - name: End to end in the image (synthetic session, MinIO, CPU)
        run: deploy/processing/tests/e2e.sh orchados-processing:ci

      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=match,pattern=processing-v(.*),group=1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/processing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
