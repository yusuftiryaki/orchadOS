name: deploy-db

# Applies new migrations to the hosted Supabase test project after they land on main,
# and deploys the Edge Functions (supabase/functions). Seed data is NOT pushed
# automatically (see docs/deployment.md).
#
# The job runs in the `test` GitHub Environment, which holds the test project's
# secrets (deployment branch rule: main only), and only from main. Missing
# secrets fail the job; before the test project is set up, the repository
# variable SUPABASE_TEST_PENDING=1 turns that into an explicit skip.
#
# After the deploy, open sign-ups need a working clean-up of accounts whose
# phone was never verified (scripts/retention-check.sh signup; T09).
#
# While the test project hosts the public demo tour (repository variable
# DEMO_HOST=test, docs/demo-turu.md §15.1), this is also the demo's deploy:
# the last step checks the shared demo locks.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db.yml"
      - "scripts/demo-guard-check.sh"
      - "scripts/demo-lock-check.sh"
      - "scripts/retention-check.sh"
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push-migrations:
    # A dispatch from another branch would run that branch's workflow and
    # migrations with the project's secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check the test project's secrets
        id: guard
        env:
          PENDING: ${{ vars.SUPABASE_TEST_PENDING }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$PENDING" = "1" ]; then
            echo "::warning::SUPABASE_TEST_PENDING=1 and the test project's secrets are not set; skipping the deploy (docs/deployment.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD or SUPABASE_PROJECT_REF is missing in the test environment (docs/deployment.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.ready == 'true'

      - name: Link project
        id: link
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.guard.outputs.ready == 'true'
        # --include-all: parallel branches add migrations whose timestamps can be
        # older than one already applied; they are independent by convention.
        run: pnpm exec supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      # A late-merged migration with an older timestamp lands after the IP13-A
      # ones here (but before them on a fresh CI database): re-attach the demo
      # write guard and fail on any demo guard lost to migration order. Runs
      # even when the push failed: each migration file commits on its own, so
      # tables from the files applied before the failure need the guard too.
      - name: Check demo guards
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        run: scripts/demo-guard-check.sh

      # Without a name every function under supabase/functions is deployed
      # (payments, payment-callback, payment-webhook included).
      # The functions read SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
      # from the hosted project itself; the service role key never leaves Supabase.
      # verify_jwt per function comes from supabase/config.toml.
      - name: Deploy Edge Functions
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      # Shared demo host (DEMO_HOST=test): an enabled demo org is accepted here,
      # with the secrets demo-start needs (DEMO_* or the shared names), Vault
      # demo_cleanup_url and orchados_cron_secret, no billing switch on a demo
      # org and no demo account outside it. The test site's own orgs, sign-up
      # and fake payments are not locks here. Runs after the deploy, so a
      # failing demo lock never holds back the test project's migrations.
      - name: Check shared demo locks
        if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' && vars.DEMO_HOST == 'test' }}
        run: scripts/demo-lock-check.sh shared

      # T09 (docs/hukuk/kararlar.md H25): while an org accepts sign-ups, the
      # pg_cron job signup-cleanup, Vault signup_cleanup_url and an
      # orchados_cron_secret equal to the ORCHADOS_CRON_SECRET Edge secret
      # must be in place, or accounts whose phone is never verified stay.
      - name: Check the unverified-account clean-up
        if: ${{ !cancelled() && steps.guard.outputs.ready == 'true' && steps.link.outcome == 'success' }}
        run: scripts/retention-check.sh signup
