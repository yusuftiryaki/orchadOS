name: keepalive

# Free Supabase projects are paused after a week without activity.
# A small authenticated REST request twice a week keeps the test project awake.

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/metric_definition?select=code&limit=1")
          echo "HTTP $code"
          test "$code" -lt 500
