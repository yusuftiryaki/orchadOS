name: keepalive

# Free Supabase projects are paused after a week without activity.
# A small REST request twice a week keeps the test and pilot projects awake.
#
# Only the project URLs and anon keys are used: public values (the anon key is
# in every web build), kept as repository secrets so this scheduled job needs
# no environment approval. The database secrets live in the test/demo/pilot
# environments (docs/deployment.md). A missing test URL or a failed request
# fails the job; SUPABASE_TEST_PENDING=1 skips the test ping before the test
# project is set up, and the pilot ping is skipped until PILOT_SUPABASE_URL is set.

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PENDING: ${{ vars.SUPABASE_TEST_PENDING }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            if [ "$PENDING" = "1" ]; then echo "::warning::test project not configured (SUPABASE_TEST_PENDING=1)"; exit 0; fi
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set (docs/deployment.md)."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/metric_definition?select=code&limit=1") || true
          echo "HTTP $code"
          # 000: no answer at all (bad URL, DNS, a paused project).
          test "$code" -ge 200 && test "$code" -lt 500

      - name: Ping pilot Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.PILOT_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PILOT_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "pilot project not configured"; exit 0; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::PILOT_SUPABASE_ANON_KEY is not set."; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/metric_definition?select=code&limit=1") || true
          echo "HTTP $code"
          test "$code" -ge 200 && test "$code" -lt 500
