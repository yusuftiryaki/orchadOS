name: Set up the web workspace
description: pnpm, Node 22 with the pnpm store cached, and the workspace's dependencies (frozen lockfile).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
